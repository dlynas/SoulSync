name: Fork — Build and Push to GHCR

on:
  workflow_dispatch:
  push:
    branches:
      - lynas-discog-feats
      - feat/discography-pagination
      - feat/wrap-discog-modal-text
      - feat/discog-modal-sort
      - feat/explicit-badges

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tag from branch name
        id: tag
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          TAG="${BRANCH//\//-}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.OWNER }}/soulsync:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ env.OWNER }}/soulsync:latest-fork
